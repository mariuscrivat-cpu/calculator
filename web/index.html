<!DOCTYPE html>
<html lang="ro" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/mathjs@13/lib/browser/math.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script type="text/javascript" src="/eel.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <main class="card p-3" style="width: 320px"
        x-data="{ d: '0',
                  press(k) {
                    if (k === 'C') { this.d = '0'; return; }
                    if (k === '=') {
                      try { this.d = String(math.evaluate(this.d.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'))); }
                      catch (e) { this.d = 'Eroare'; }
                      return;
                    }
                    this.d = (this.d === '0' || this.d === 'Eroare') && /[0-9.]/.test(k) ? k : this.d + k;
                  } }">
    <div id="display" class="form-control form-control-lg text-end mb-3" aria-live="polite" x-text="d">0</div>
    <div class="row g-2">
      <template x-for="k in ['C','÷','×','−','7','8','9','+','4','5','6','=','1','2','3','0','.']" :key="k">
        <div class="col-3">
          <button class="btn btn-secondary w-100" :data-key="k" x-text="k" @click="press(k)"></button>
        </div>
      </template>
    </div>
  </main>
</body>
</html>
