<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
  <main class="calculator">
    <div id="display" class="display" aria-live="polite">0</div>
    <div class="keys">
      <button class="key clear" data-key="C">C</button>
      <button class="key op" data-key="÷">÷</button>
      <button class="key op" data-key="×">×</button>
      <button class="key op" data-key="−">−</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key op tall" data-key="+">+</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key equals tall" data-key="=">=</button>
      <button class="key zero" data-key="0">0</button>
      <button class="key" data-key=".">.</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
